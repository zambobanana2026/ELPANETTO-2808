<style>
:root {
  --bg: #ffffff;
  --surface: #f7f7f5;
  --text: #111111;
  --accent: #111111;
  --border: #dcdcd8;
  --muted: #767672;
  --font-serif: 'Cormorant Garamond', serif;
  --font-sans: 'Jost', sans-serif;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  transition: background 0.25s ease, color 0.25s ease;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  font-family: var(--font-serif);
  font-weight: 500;
  letter-spacing: 0.02em;
  margin: 0;
}

.app { min-height: 100vh; display: flex; flex-direction: column; }

/* ---- Ticker ---- */
.ticker {
  background: var(--text);
  color: var(--bg);
  overflow: hidden;
  white-space: nowrap;
  padding: 8px 0;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.ticker-track {
  display: inline-block;
  padding-left: 100%;
  animation: ticker-scroll 28s linear infinite;
}
@keyframes ticker-scroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}

/* ---- Header ---- */
.header {
  padding: 28px 32px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.header-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-size: 34px; letter-spacing: 0.14em; text-transform: uppercase; }
.subtitle { color: var(--muted); font-size: 13px; letter-spacing: 0.05em; margin: 6px 0 18px; text-transform: uppercase; }
.header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }

.theme-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.theme-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 12px; border: 1px solid var(--border); background: transparent; color: var(--text);
  border-radius: 999px; cursor: pointer; font-family: var(--font-sans); font-size: 12px; letter-spacing: 0.04em;
}
.theme-chip.active { border-color: var(--accent); background: var(--surface); font-weight: 600; }
.theme-swatch { width: 14px; height: 14px; border-radius: 50%; border: 2px solid; display: inline-block; }

.color-editor {
  display: flex; flex-wrap: wrap; gap: 16px; padding: 14px; margin-bottom: 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
}
.color-field { display: flex; flex-direction: column; gap: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.color-field input { width: 48px; height: 32px; border: 1px solid var(--border); background: none; cursor: pointer; }

.btn-check {
  width: 100%; padding: 14px; margin-top: 4px; background: var(--text); color: var(--bg);
  border: none; font-family: var(--font-sans); text-transform: uppercase; letter-spacing: 0.1em; font-size: 13px;
  cursor: pointer; border-radius: 4px;
}
.btn-check:hover { opacity: 0.85; }

/* ---- Tabs ---- */
.tabs { display: flex; gap: 4px; padding: 0 32px; border-bottom: 1px solid var(--border); overflow-x: auto; background: var(--bg); }
.tab-btn {
  background: none; border: none; padding: 14px 16px; font-family: var(--font-sans); font-size: 13px;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
}
.tab-btn.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

.main { flex: 1; padding: 28px 32px 60px; background: var(--bg); }

.section { max-width: 1200px; margin: 0 auto; }
.section h2 { font-size: 26px; margin-bottom: 18px; }
.section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }

/* ---- Buttons ---- */
.btn {
  padding: 9px 18px; background: var(--text); color: var(--bg); border: 1px solid var(--text);
  font-family: var(--font-sans); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
  cursor: pointer; border-radius: 4px;
}
.btn:hover { opacity: 0.85; }
.btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid transparent; }
.btn-danger { background: #c23b3b; border-color: #c23b3b; color: #fff; }
.btn-danger-outline { background: transparent; color: #c23b3b; border: 1px solid #c23b3b; }
.btn-mini { padding: 5px 10px; font-size: 11px; background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 4px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em; }
.btn-x { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text); line-height: 1; }

/* ---- Tables ---- */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  text-align: left; padding: 12px 14px; background: var(--surface); text-transform: uppercase;
  font-size: 11px; letter-spacing: 0.06em; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap;
}
tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
tbody tr:last-child td { border-bottom: none; }
.cell-month { font-family: var(--font-serif); font-size: 15px; }
.tappable { cursor: pointer; }
.tappable:hover { background: var(--surface); }
.strong { font-weight: 600; }
.row-payoff { background: color-mix(in srgb, var(--accent) 8%, transparent); }
tbody input, tbody select { width: 100%; min-width: 90px; font-family: var(--font-sans); font-size: 13px; padding: 5px 7px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); }

/* ---- Op cards ---- */
.op-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
.op-card { border: 1px solid var(--border); border-radius: 8px; padding: 16px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
.op-card.paused { opacity: 0.6; }
.op-card.done { border-color: #2e9e4d; }
.op-card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.op-card-head h3 { font-size: 18px; }
.badge { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 3px 8px; white-space: nowrap; }
.op-progress { height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; }
.op-progress-bar { height: 100%; background: var(--accent); }
.op-numbers { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.iban-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; }
.iban-row code { font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.notes { width: 100%; min-height: 44px; font-family: var(--font-sans); font-size: 12px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; resize: vertical; background: var(--bg); color: var(--text); }
.op-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 11px; }
.status-pill { padding: 3px 9px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.04em; font-size: 10px; }
.status-active { background: #dff2e2; color: #1c6b32; }
.status-paused { background: #f4e6c8; color: #8a6a12; }
.countdown { color: var(--muted); }

/* ---- Field rows ---- */
.field-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; font-size: 13px; }
.field-row label { color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; }
.field-row input, .field-row select { padding: 7px 9px; border: 1px solid var(--border); border-radius: 4px; font-family: var(--font-sans); max-width: 55%; background: var(--bg); color: var(--text); }

/* ---- Drawer ---- */
.drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100; }
.drawer-overlay.open { opacity: 1; pointer-events: auto; }
.drawer { position: absolute; right: 0; top: 0; bottom: 0; width: min(420px, 92vw); background: var(--bg); color: var(--text); box-shadow: -6px 0 24px rgba(0,0,0,0.15); transform: translateX(100%); transition: transform 0.25s; padding: 22px; overflow-y: auto; }
.drawer-overlay.open .drawer { transform: translateX(0); }
.drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.breakdown-list { list-style: none; padding: 0; margin: 0 0 14px; display: flex; flex-direction: column; gap: 8px; }
.breakdown-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
.breakdown-list input { width: 90px; padding: 5px 7px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); }
.summary-box { margin-top: 16px; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.qr-block { margin-top: 18px; text-align: center; }
.qr-canvas { display: flex; justify-content: center; margin: 12px 0; }

/* ---- Modal ---- */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
.modal-box { background: var(--bg); color: var(--text); border-radius: 10px; padding: 26px; max-width: 480px; width: 100%; max-height: 88vh; overflow-y: auto; }
.modal-box.tone-success { text-align: center; border: 2px solid #2e9e4d; }
.modal-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.form-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.form-grid label.full { grid-column: 1 / -1; }
.form-grid input, .form-grid select, .form-grid textarea { padding: 8px 9px; border: 1px solid var(--border); border-radius: 4px; font-family: var(--font-sans); font-size: 13px; background: var(--bg); color: var(--text); }

.check-modal .check-icon { width: 56px; height: 56px; border-radius: 50%; background: #2e9e4d; color: #fff; font-size: 28px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
.check-modal .big { font-family: var(--font-serif); font-size: 28px; margin: 6px 0; }

/* ---- Calendar ---- */
.calendar-list { list-style: none; padding: 0; margin: 0 0 16px; display: flex; flex-direction: column; gap: 8px; }
.calendar-list li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); font-size: 13px; }
.cal-name { flex: 1; }
.cal-amount { font-weight: 600; }
.badge.type-Fixkosten { background: var(--surface); }
.badge.type-OP { background: var(--accent); color: var(--bg); border-color: var(--accent); }

/* ---- Statistik ---- */
.stat-block { border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 20px; background: var(--surface); }
.stat-block h4 { margin-bottom: 12px; font-size: 15px; }
.thermometer { height: 22px; background: var(--border); border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
.thermometer-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #2e9e4d); transition: width 0.3s; }
.donut-row { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.donut-legend { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.donut-label { font-family: var(--font-sans); font-size: 16px; fill: var(--text); }
.ampel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; }
.ampel-cell { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); }

.muted { color: var(--muted); }

.footer { text-align: center; padding: 18px; font-size: 11px; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; border-top: 1px solid var(--border); }

@media (max-width: 640px) {
  .header { padding: 20px 16px 14px; }
  .main { padding: 20px 16px 40px; }
  .tabs { padding: 0 16px; }
  .brand h1 { font-size: 24px; }
  .form-grid { grid-template-columns: 1fr; }
}
</style>
